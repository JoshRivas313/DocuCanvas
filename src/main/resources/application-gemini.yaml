# ─────────────────────────────────────────────────────────────────────────────
# Perfil Gemini — Gemini Developer API (Google AI Studio) con API Key.
#
#   ./mvnw -Pgemini spring-boot:run -Dspring-boot.run.profiles=dev,gemini
#
# Credencial (NUNCA en el repositorio):
#   GEMINI_API_KEY   clave creada en https://aistudio.google.com/api-keys
#
# ── Por qué la configuración habla de "openai" para llamar a Gemini ──────────
#
# Spring AI 1.0.0 GA no tiene módulo para la Gemini Developer API: el starter
# spring-ai-starter-model-google-genai aparece en 1.1.0, que arrastra Spring
# Boot 3.5. Su único módulo de Google en 1.0.0 es Vertex AI, que se autentica
# con service account, no con API Key.
#
# Pero Google publica una capa compatible con OpenAI sobre la Gemini Developer
# API, y el cliente de OpenAI de Spring AI 1.0.0 permite reescribir la URL base
# y la ruta de completions. Es decir: se usa el *transporte* de OpenAI para
# hablar con *Gemini*. El modelo que responde es Gemini, la clave es la de AI
# Studio y no interviene ningún servicio de OpenAI.
#
# Verificado contra el endpoint real:
#   POST .../v1beta/openai/chat/completions  -> 400 "Missing Authorization"  (existe)
#   POST .../v1beta/openai/images/generations -> 404 "entity was not found"  (no existe)
# Por eso el chat va por esta vía y las imágenes por el endpoint nativo
# (ver docucanvas.gemini.image y GeminiImageModel).
# ─────────────────────────────────────────────────────────────────────────────
spring:
  ai:
    model:
      chat: openai          # transporte OpenAI-compatible apuntando a Gemini
      embedding: ollama     # los vectores indexados son de nomic-embed-text
      image: none           # el ImageModel lo aporta GeminiImageModel, no OpenAI

    # Reintentos. El default de Spring AI es max-attempts=10 con backoff inicial
    # de 2s y multiplicador 5 (2s -> 10s -> 50s...). Medido contra la API real,
    # ~1 de cada 5 llamadas devuelve 503 transitorio: con ese backoff, un 503
    # convertia una consulta de 3s en uno de 22s y disparaba el timeout, con lo
    # que se perdia el visualPrompt y la imagen caia al SVG.
    # Con 2 intentos y medio segundo de espera, el 503 cuesta ~0,5s.
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s

    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com
      chat:
        # Sin esto, el cliente pediría /v1/chat/completions y Google devolvería 404.
        completions-path: /v1beta/openai/chat/completions
        options:
          model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}

docucanvas:
  rag:
    generation:
      model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
      # Gemini no corre en la CPU local: los throughputs medidos para llama3.2
      # no aplican. Con un modelo remoto y rápido el timeout puede ser ajustado.
      prefill-tokens-per-second: 2000.0
      output-tokens-per-second: 60.0
      min-timeout-seconds: 35
      max-timeout-seconds: 60

  # Generación de imágenes por el endpoint nativo de la Developer API,
  # con la MISMA clave que el chat.
  gemini:
    image:
      # Apagado por defecto: la generacion de imagen NO tiene nivel gratuito
      # (la API responde 429 con "limit: 0"). Con esto activo, cada consulta
      # gasta ~850 ms en una llamada condenada a fallar antes de degradar al SVG.
      # Activalo solo cuando la cuenta tenga facturacion: GEMINI_IMAGE_ENABLED=true
      enabled: ${GEMINI_IMAGE_ENABLED:false}
      api-key: ${GEMINI_API_KEY}
      model: ${GEMINI_IMAGE_MODEL:gemini-2.5-flash-image}

  # ── Alternativa gratuita para la imagen ──────────────────────────────────
  # Gemini no tiene nivel gratuito de imagen; Workers AI da 10.000 Neurons
  # diarios. Una imagen de 1024x1024 con FLUX-1-schnell cuesta ~57 Neurons:
  # unas 170 imagenes al dia, renovadas cada dia.
  #
  #   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN  (token con permiso Workers AI)
  #   CLOUDFLARE_IMAGE_ENABLED=true
  #
  # Es la SEGUNDA implementacion de ImageModel del proyecto. El pipeline no
  # sabe cual esta enchufado: cambiar de proveedor es esta propiedad.
  cloudflare:
    image:
      enabled: ${CLOUDFLARE_IMAGE_ENABLED:false}
      account-id: ${CLOUDFLARE_ACCOUNT_ID:}
      api-token: ${CLOUDFLARE_API_TOKEN:}
      model: ${CLOUDFLARE_IMAGE_MODEL:@cf/black-forest-labs/flux-1-schnell}

logging:
  level:
    org.springframework.ai: INFO

