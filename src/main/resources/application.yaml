spring:
  application:
    name: docu-canvas
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
          temperature: 0.7
          num-ctx: 4096
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        table-name: document_chunks
        dimensions: 768

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/docucanvas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Rate limiting de endpoints costosos (ver RateLimitingFilter)
docucanvas:
  ratelimit:
    capacity: ${RATELIMIT_CAPACITY:20}
    window-seconds: ${RATELIMIT_WINDOW_SECONDS:60}

logging:
  level:
    org.springframework.ai: INFO
    com.docucanvas: INFO
