spring:
  application:
    name: docu-canvas
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
          temperature: 0.7
          num-ctx: 4096
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        table-name: document_chunks
        dimensions: 768

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/docucanvas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Rate limiting de endpoints costosos (ver RateLimitingFilter)
docucanvas:
  ratelimit:
    capacity: ${RATELIMIT_CAPACITY:20}
    window-seconds: ${RATELIMIT_WINDOW_SECONDS:60}

  # Parámetros del pipeline RAG (ver RagProperties para el porqué de cada valor).
  # Están aquí, y no como constantes en el código, porque tunear chunking y
  # retrieval es la operación más frecuente al adaptar RAG a un corpus nuevo.
  rag:
    chunking:
      chunk-size: ${RAG_CHUNK_SIZE:200}          # tokens objetivo por chunk
      min-chunk-size-chars: ${RAG_MIN_CHUNK_CHARS:50}
      min-chunk-length-to-embed: 5
      max-num-chunks: 10000
      keep-separator: true
    retrieval:
      default-top-k: ${RAG_DEFAULT_TOP_K:5}
      max-top-k: ${RAG_MAX_TOP_K:20}             # tope duro: protege ventana de contexto y coste
      strict-threshold: ${RAG_STRICT_THRESHOLD:0.3}
      relaxed-threshold: ${RAG_RELAXED_THRESHOLD:0.0}  # segunda oportunidad para preguntas abstractas
    generation:
      max-output-tokens: ${RAG_MAX_OUTPUT_TOKENS:400}
      # Constantes de timeout dinámico calibradas para llama3.2 en CPU.
      # Al migrar a Gemini estos throughputs dejan de aplicar: recalibrar.
      chars-per-token: 3.7
      prefill-tokens-per-second: 25.0
      output-tokens-per-second: 5.0
      timeout-margin-seconds: 15
      min-timeout-seconds: 30
      max-timeout-seconds: 150

logging:
  level:
    org.springframework.ai: INFO
    com.docucanvas: INFO
