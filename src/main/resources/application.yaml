spring:
  application:
    name: docu-canvas
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:OPENAI_KEY_REMOVED}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-3-small
      image:
        options:
          model: dall-e-3
          n: 1
          size: 1024x1024
    vectorstore:
      pgvector:
        table-name: document_chunks
        dimensions: 1536

  datasource:
    url: jdbc:postgresql://localhost:5433/docucanvas
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org.springframework.ai: DEBUG
    com.docucanvas: DEBUG
