spring:
  application:
    name: docu-canvas
  ai:
    google:
      ai:
        gemini:
          api-key: AIzaSyChPbQ1_oAB040XTm38daliDlgDt9SUtaw
          chat:
            options:
              model: gemini-1.5-flash
          embedding:
            options:
              model: text-embedding-004
      vectorstore:
        pgvector:
          table-name: document_chunks
          index-type: HNSW
          distance-type: COSINE
          dimensions: 768

  datasource:
    url: jdbc:postgresql://localhost:5433/docucanvas
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org.springframework.ai: DEBUG
    com.docucanvas: DEBUG
