<!-- templates/fragments/pipeline_view.html -->
<div th:fragment="pipeline_view" x-show="view === 'pipeline'" x-transition x-cloak>
    <div class="glass p-8 rounded-2xl shadow-2xl flex flex-col items-center justify-center min-h-[70vh] bg-slate-900/40 border border-white/5 relative overflow-hidden">
        <!-- Background Glow -->
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-sky-500/10 rounded-full blur-[100px] pointer-events-none"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-500/10 rounded-full blur-[100px] pointer-events-none"></div>

        <h2 class="text-3xl font-bold mb-12 gradient-text tracking-tight">Multimodal RAG Pipeline</h2>
        
        <!-- SVG Diagram -->
        <div class="w-full max-w-5xl glass p-8 rounded-3xl border-white/10 shadow-inner relative z-10">
            <svg viewBox="0 0 800 300" class="w-full h-auto drop-shadow-2xl">
                <defs>
                    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#38bdf8" />
                        <stop offset="100%" stop-color="#818cf8" />
                    </linearGradient>
                    <filter id="svg-glow">
                        <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                <!-- Flow Lines -->
                <path class="animate-flow" d="M 100 150 L 700 150" fill="none" stroke="url(#glow)" stroke-width="4" filter="url(#svg-glow)" />

                <!-- Nodes -->
                <g transform="translate(50, 100)" class="hover:scale-105 transition-transform duration-300">
                    <rect width="100" height="100" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2" class="shadow-lg" />
                    <text x="50" y="55" fill="white" font-size="13" text-anchor="middle" font-weight="bold">Documento</text>
                    <text x="50" y="75" fill="#64748b" font-size="10" text-anchor="middle">(Blob Store)</text>
                </g>

                <g transform="translate(250, 100)" class="animate-pulse">
                    <rect width="100" height="100" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
                    <text x="50" y="45" fill="white" font-size="13" text-anchor="middle" font-weight="bold">Tika</text>
                    <text x="50" y="70" fill="#94a3b8" font-size="11" text-anchor="middle">+ Tokenizer</text>
                </g>

                <g transform="translate(450, 100)">
                    <rect width="100" height="100" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
                    <text x="50" y="45" fill="white" font-size="13" text-anchor="middle" font-weight="bold">PgVector</text>
                    <text x="50" y="70" fill="#94a3b8" font-size="11" text-anchor="middle">Semantic DB</text>
                </g>

                <g transform="translate(650, 100)" class="animate-bounce">
                    <rect width="120" height="100" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
                    <text x="60" y="45" fill="white" font-size="13" text-anchor="middle" font-weight="bold">Gemini 2.0</text>
                    <text x="60" y="70" fill="#94a3b8" font-size="11" text-anchor="middle">+ DALL-E 3</text>
                </g>
            </svg>
        </div>

        <div class="mt-12 text-center text-slate-400 space-y-2">
            <p>Arquitectura impulsada por <span class="text-sky-400 font-bold">Spring AI 1.0.0-M5</span>.</p>
            <p class="text-[11px] opacity-60 uppercase tracking-widest">Ingesta Paralela • Búsqueda Vectorial • Generación Multimodal</p>
        </div>
    </div>
</div>
