<!-- templates/fragments/ask_view.html -->
<div th:fragment="ask_view" x-show="view === 'ask'" x-transition x-cloak>
    <div class="flex flex-col h-[75vh] glass rounded-2xl overflow-hidden shadow-2xl relative">
        <!-- Chat Area -->
        <div class="flex-1 overflow-y-auto p-6 space-y-5 bg-slate-900/50 custom-scrollbar" id="chatbox">
            <template x-for="msg in chatHistory">
                <div :class="msg.role === 'user' ? 'justify-end' : 'justify-start'" class="flex">

                    <!-- Burbuja simple: mensajes de usuario, o IA sin informe (saludo, errores) -->
                    <div x-show="msg.role === 'user' || !msg.insights"
                        :class="msg.role === 'user' ? 'bg-sky-600 rounded-tr-none max-w-[80%]' : 'glass rounded-tl-none border-white/5 max-w-[80%]'"
                        class="p-4 rounded-2xl shadow-lg">
                        <p class="text-sm leading-relaxed" x-text="msg.content"></p>
                    </div>

                    <!-- ═══════════ INFORME RAG (mensajes de IA con insights) ═══════════ -->
                    <div x-show="msg.role === 'ai' && msg.insights"
                        class="glass rounded-2xl rounded-tl-none border-white/5 shadow-lg max-w-[92%] w-full overflow-hidden">

                        <!-- 6. Confianza -->
                        <div class="px-5 py-2.5 flex items-center gap-2 border-b border-white/5"
                            :class="{ALTA:'bg-emerald-500/10', MEDIA:'bg-amber-500/10', BAJA:'bg-rose-500/10'}[msg.insights?.confidenceLevel]">
                            <span class="text-sm" x-text="{ALTA:'🟢', MEDIA:'🟡', BAJA:'🔴'}[msg.insights?.confidenceLevel]"></span>
                            <span class="text-[10px] font-bold uppercase tracking-widest"
                                :class="{ALTA:'text-emerald-400', MEDIA:'text-amber-400', BAJA:'text-rose-400'}[msg.insights?.confidenceLevel]"
                                x-text="{ALTA:'Alta confianza', MEDIA:'Confianza media', BAJA:'Baja confianza'}[msg.insights?.confidenceLevel] + ' — ' + Math.round((msg.insights?.confidenceScore || 0) * 100) + '% similitud promedio'"></span>
                            <span x-show="msg.insights?.partialMatch" x-cloak
                                class="ml-auto text-[9px] bg-white/10 text-slate-300 px-2 py-0.5 rounded-full font-bold">
                                Evidencia parcial
                            </span>
                        </div>

                        <!-- 1. Resumen ejecutivo -->
                        <div class="px-6 py-5">
                            <p class="text-[10px] font-bold text-sky-400 uppercase tracking-widest mb-2">📋 Resumen Ejecutivo</p>
                            <p class="text-sm leading-relaxed text-slate-200 whitespace-pre-line" x-text="msg.content"></p>
                        </div>

                        <!-- 2. Imagen representativa, con su procedencia declarada -->
                        <template x-if="msg.imageUrl">
                            <div class="px-6 pb-5">
                                <div class="flex items-center justify-between mb-2">
                                    <p class="text-[10px] font-bold text-sky-400 uppercase tracking-widest">🖼️ Representación visual</p>
                                    <!-- El sistema declara qué produjo la imagen, en vez de dejar que se asuma -->
                                    <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border"
                                        :class="msg.imageSource === 'GENERATIVE_IMAGE_MODEL'
                                            ? 'bg-fuchsia-900/40 text-fuchsia-300 border-fuchsia-500/30'
                                            : 'bg-slate-800/60 text-slate-400 border-white/10'"
                                        x-text="msg.imageSource === 'GENERATIVE_IMAGE_MODEL'
                                            ? 'Generada por IA'
                                            : 'Diagrama local (respaldo)'"></span>
                                </div>
                                <img :src="msg.imageUrl"
                                    class="rounded-xl shadow-2xl w-full border border-white/10">

                                <!-- El prompt que el LLM derivó del contexto: hace auditable
                                     la relación entre el documento y lo que se dibujó -->
                                <template x-if="msg.visualPrompt">
                                    <details class="mt-3 group">
                                        <summary class="text-[10px] font-bold text-slate-400 uppercase tracking-widest cursor-pointer hover:text-sky-400 transition-colors">
                                            🧠 Prompt visual generado por el modelo
                                        </summary>
                                        <p class="mt-2 text-xs leading-relaxed text-slate-300 font-mono bg-black/30 border border-white/10 rounded-lg p-3"
                                            x-text="msg.visualPrompt"></p>
                                    </details>
                                </template>
                            </div>
                        </template>

                        <!-- 7. Conceptos principales -->
                        <template x-if="msg.insights?.keyConcepts?.length">
                            <div class="px-6 pb-5">
                                <p class="text-[10px] font-bold text-sky-400 uppercase tracking-widest mb-2">🔑 Conceptos Principales</p>
                                <div class="flex flex-wrap gap-2">
                                    <template x-for="concept in msg.insights.keyConcepts">
                                        <span class="text-xs bg-sky-900/40 text-sky-300 border border-sky-500/20 px-3 py-1 rounded-full font-semibold"
                                            x-text="concept"></span>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- 8. Relaciones -->
                        <template x-if="msg.insights?.conceptRelations?.length">
                            <div class="px-6 pb-5">
                                <p class="text-[10px] font-bold text-sky-400 uppercase tracking-widest mb-2">🕸️ Relaciones</p>
                                <div class="space-y-2">
                                    <template x-for="rel in msg.insights.conceptRelations">
                                        <div class="bg-white/5 rounded-lg p-3 border border-white/5">
                                            <div class="flex items-center gap-2 mb-1.5">
                                                <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
                                                <span class="text-xs font-bold text-indigo-300" x-text="rel.concept"></span>
                                            </div>
                                            <div class="pl-3.5 flex flex-wrap gap-1.5">
                                                <template x-for="topic in rel.relatedTopics">
                                                    <span class="text-[10px] text-slate-400 bg-slate-800/60 px-2 py-0.5 rounded"
                                                        x-text="topic"></span>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- 3. Evidencia utilizada -->
                        <template x-if="msg.citations && msg.citations.length > 0">
                            <div class="px-6 pb-5">
                                <p class="text-[10px] font-bold text-sky-400 uppercase tracking-widest mb-2">📄 Evidencia Utilizada</p>
                                <div class="space-y-2">
                                    <template x-for="(cit, idx) in msg.citations" :key="idx">
                                        <div class="bg-white/5 rounded-lg p-3 border border-white/5">
                                            <div class="flex items-center justify-between mb-1.5 gap-2">
                                                <span class="text-xs font-bold text-slate-200 truncate" x-text="cit.source"></span>
                                                <div class="flex items-center gap-2 flex-shrink-0">
                                                    <span x-show="cit.page" x-cloak class="text-[9px] text-slate-500 font-mono" x-text="'Pág. ' + cit.page"></span>
                                                    <span x-show="cit.score != null" x-cloak
                                                        class="text-[9px] bg-sky-900/40 text-sky-300 px-1.5 py-0.5 rounded font-bold font-mono"
                                                        x-text="Math.round(cit.score * 100) + '%'"></span>
                                                </div>
                                            </div>
                                            <p class="text-[11px] text-slate-400 italic leading-relaxed line-clamp-3" x-text="'&quot;' + cit.content + '&quot;'"></p>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- 9. Documentos utilizados -->
                        <template x-if="msg.insights?.documentsUsed?.length">
                            <div class="px-6 pb-5">
                                <p class="text-[10px] font-bold text-sky-400 uppercase tracking-widest mb-2">📚 Documentos Utilizados</p>
                                <div class="flex flex-wrap gap-2">
                                    <template x-for="doc in msg.insights.documentsUsed">
                                        <span class="text-xs bg-white/5 border border-white/10 text-slate-300 px-3 py-1 rounded-lg" x-text="'📄 ' + doc"></span>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- 4 + 5. Cómo se encontró + Estadísticas de recuperación -->
                        <div class="px-6 py-4 bg-slate-900/60 border-t border-white/5">
                            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">⚙️ Cómo se encontró esta información</p>
                            <p class="text-[11px] text-slate-400 leading-relaxed mb-4" x-text="msg.insights?.howItWasFound"></p>

                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                <div>
                                    <p class="text-[9px] text-slate-500 uppercase font-bold tracking-widest">Chunks analizados</p>
                                    <p class="text-sm font-bold text-slate-200 font-mono" x-text="msg.insights?.totalChunksAnalyzed"></p>
                                </div>
                                <div>
                                    <p class="text-[9px] text-slate-500 uppercase font-bold tracking-widest">Chunks recuperados</p>
                                    <p class="text-sm font-bold text-slate-200 font-mono" x-text="msg.citations?.length || 0"></p>
                                </div>
                                <div>
                                    <p class="text-[9px] text-slate-500 uppercase font-bold tracking-widest">Retrieval</p>
                                    <p class="text-sm font-bold text-sky-400 font-mono" x-text="(msg.metrics?.retrieval ?? '—') + ' ms'"></p>
                                </div>
                                <div>
                                    <p class="text-[9px] text-slate-500 uppercase font-bold tracking-widest">Generación LLM</p>
                                    <p class="text-sm font-bold text-indigo-400 font-mono" x-text="((msg.metrics?.generation ?? 0) / 1000).toFixed(1) + ' s'"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
            <div x-show="loading" class="flex justify-start">
                <div class="glass p-4 rounded-2xl animate-pulse text-sky-400 font-bold border-sky-500/30">DocuCanvas está pensando...</div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-6 border-t border-white/5 glass bg-slate-900/80 backdrop-blur-md">
            <div class="flex flex-col gap-3 max-w-4xl mx-auto">
                <!-- Filtro por documento -->
                <div class="flex items-center gap-2 text-xs text-slate-400">
                    <svg class="w-4 h-4 text-sky-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L13 13.414V19a1 1 0 01-.553.894l-4 2A1 1 0 017 21v-7.586L3.293 6.707A1 1 0 013 6V4z"/>
                    </svg>
                    <span class="font-semibold text-slate-300">Buscar en:</span>
                    <select x-model="selectedAskDocumentId"
                        class="bg-slate-800/80 border border-white/10 rounded-lg px-3 py-1.5 outline-none focus:ring-1 focus:ring-sky-500 text-xs text-slate-200 flex-1 max-w-xs">
                        <option value="">📚 Todos los documentos</option>
                        <template x-for="doc in documents.filter(d => d.status === 'READY' && d.chunkCount > 0)" :key="doc.id">
                            <option :value="doc.id" x-text="'📄 ' + doc.title"></option>
                        </template>
                    </select>
                    <span x-show="selectedAskDocumentId !== ''"
                        x-cloak
                        class="text-[10px] bg-sky-900/40 text-sky-300 border border-sky-500/20 px-2 py-0.5 rounded-full font-bold whitespace-nowrap">
                        ✔ Filtrado
                    </span>
                </div>
                <!-- Campo de pregunta -->
                <div class="flex gap-3">
                    <input x-model="question" @keyup.enter="askQuestion()" type="text"
                        placeholder="Escribe tu pregunta aquí..."
                        class="flex-1 bg-slate-800/80 border border-white/10 rounded-xl p-4 outline-none focus:ring-2 focus:ring-sky-500 transition-all shadow-inner">
                    <button @click="askQuestion()" :disabled="loading"
                        class="bg-sky-600 p-4 rounded-xl hover:bg-sky-500 transition disabled:opacity-50 shadow-lg hover:shadow-sky-500/20 flex items-center gap-2 font-bold">
                        <span x-show="!loading">Preguntar</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
