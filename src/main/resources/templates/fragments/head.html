<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuCanvas | Inteligencia sobre tus Documentos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Plotly solo se usa al abrir el Visor de Embeddings; defer no bloquea el primer render. -->
    <script defer src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <!-- Lógica de la app (módulo ES). Debe cargarse antes que Alpine para registrar
         el componente en el evento alpine:init. -->
    <script type="module" src="/js/app.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .premium-scrollbar::-webkit-scrollbar { width: 6px; }
        .premium-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .premium-scrollbar::-webkit-scrollbar-thumb { 
            background: #38bdf8; 
            border-radius: 10px;
            box-shadow: inset 0 0 6px rgba(56, 189, 248, 0.5);
        }
        .premium-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #38bdf8 transparent;
        }
        [x-cloak] { display: none !important; }
        @keyframes dash { to { stroke-dashoffset: -100; } }
        .animate-flow { stroke-dasharray: 10, 10; animation: dash 2s linear infinite; }
    </style>
</head>
</html>
