services:
  postgres:
    image: ankane/pgvector:latest
    container_name: docucanvas-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: docucanvas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d docucanvas -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
