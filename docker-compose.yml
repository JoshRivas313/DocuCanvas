services:

  # Base de datos PostgreSQL con extension pgvector
  postgres:
    image: ankane/pgvector:latest
    container_name: docucanvas-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: docucanvas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d docucanvas -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Motor de IA local (Ollama) - reemplaza la API de OpenAI
  # Ejecuta LLM y embeddings 100% en local, sin costo, sin internet.
  #
  # Modelos descargados automaticamente al iniciar:
  #   - llama3.2         -> LLM para el pipeline RAG (chat / razonamiento)
  #   - nomic-embed-text -> Embeddings de 768 dims, compatible con pgvector
  #
  # NOTA: La primera ejecucion descarga ~2-5 GB de modelos.
  #       Asegurate de tener espacio en disco suficiente.
  #
  # GPU NVIDIA (opcional): descomenta el bloque 'deploy' para acelerar la inferencia.
  ollama:
    image: ollama/ollama:latest
    container_name: docucanvas-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
    # El healthcheck usa el propio CLI de ollama, no curl: la imagen
    # ollama/ollama no incluye curl, asi que "curl -sf ..." fallaba siempre con
    # "curl: not found". El contenedor quedaba marcado unhealthy de forma
    # permanente y, como ollama-init depende de service_healthy, los modelos no
    # se descargaban NUNCA: en una maquina limpia el arranque en 3 pasos del
    # README fallaba en silencio.
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    # Descomenta para usar GPU NVIDIA:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Servicio de inicializacion: descarga los modelos una sola vez y se detiene.
  # Depende de que ollama este healthy antes de ejecutarse.
  ollama-init:
    image: ollama/ollama:latest
    container_name: docucanvas-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      sh -c "
        echo '>>> Descargando modelo de chat: llama3.2 ...' &&
        ollama pull llama3.2 &&
        echo '>>> Descargando modelo de embeddings: nomic-embed-text ...' &&
        ollama pull nomic-embed-text &&
        echo '>>> Modelos listos. DocuCanvas puede iniciar.'
      "
    restart: "no"

volumes:
  pgdata:
  ollama_data:
